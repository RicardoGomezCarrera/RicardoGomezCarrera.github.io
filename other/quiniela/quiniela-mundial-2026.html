<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiniela Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #F5B800;
    --dark: #0D0D0D;
    --mid: #1A1A2E;
    --card: #16213E;
    --border: #0F3460;
    --text: #E8E8E8;
    --muted: #888;
    --accent: #E94560;
    --green: #4CAF50;
    --draw: #FF9800;
    --loss: #E94560;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    min-height: 100vh;
    background-image: 
      radial-gradient(ellipse at 20% 50%, rgba(15,52,96,0.3) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 20%, rgba(233,69,96,0.15) 0%, transparent 50%);
  }

  header {
    text-align: center;
    padding: 40px 20px 30px;
    border-bottom: 1px solid rgba(245,184,0,0.2);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(180deg, rgba(245,184,0,0.05) 0%, transparent 100%);
  }

  .trophy { font-size: 3rem; display: block; margin-bottom: 8px; }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 4px;
    color: var(--gold);
    line-height: 0.9;
    text-shadow: 0 0 40px rgba(245,184,0,0.3);
  }

  .subtitle {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 6px;
    color: var(--muted);
    margin-top: 8px;
    text-transform: uppercase;
  }

  .player-setup {
    max-width: 500px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .setup-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 30px;
    text-align: center;
  }

  .setup-card h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 20px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }

  .player-input {
    flex: 1;
    background: var(--mid);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }

  .player-input:focus { border-color: var(--gold); }

  .btn {
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .btn-gold {
    background: var(--gold);
    color: var(--dark);
  }
  .btn-gold:hover { background: #ffd000; transform: translateY(-1px); }

  .btn-outline {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); }

  .btn-accent {
    background: var(--accent);
    color: white;
    width: 100%;
    padding: 14px;
    font-size: 1.1rem;
    margin-top: 10px;
  }
  .btn-accent:hover { background: #ff2d4d; transform: translateY(-1px); }

  .players-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 15px 0;
    justify-content: center;
  }

  .player-tag {
    background: var(--mid);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-family: 'Barlow Condensed', sans-serif;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .player-tag:hover { background: rgba(245,184,0,0.1); }

  /* QUINIELA MAIN */
  #quiniela {
    display: none;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 30px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }

  .player-selector {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .player-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .player-btn.active {
    background: var(--gold);
    color: var(--dark);
    border-color: var(--gold);
    font-weight: 700;
  }
  .player-btn:hover:not(.active) { border-color: var(--gold); color: var(--gold); }

  .score-bar {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 2px;
    color: var(--gold);
  }

  /* GROUPS */
  .groups-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 20px;
    margin-bottom: 40px;
  }

  .group-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .group-header {
    background: linear-gradient(135deg, var(--border), #0a2040);
    padding: 12px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .group-letter {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    color: var(--gold);
    line-height: 1;
    min-width: 30px;
  }

  .group-teams-names {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.5px;
  }

  .matches-list { padding: 8px 0; }

  .match-row {
    display: flex;
    align-items: center;
    padding: 8px 16px;
    gap: 8px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
  }
  .match-row:last-child { border-bottom: none; }
  .match-row:hover { background: rgba(255,255,255,0.03); }

  .team-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .team-flag { font-size: 1.2rem; }

  .team-home { text-align: right; }
  .team-away { text-align: left; }

  .score-inputs {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .score-input {
    width: 36px;
    height: 36px;
    text-align: center;
    background: var(--mid);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--gold);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    outline: none;
    transition: all 0.2s;
    -moz-appearance: textfield;
  }
  .score-input::-webkit-outer-spin-button,
  .score-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .score-input:focus { border-color: var(--gold); background: rgba(245,184,0,0.1); }
  .score-input.filled { border-color: rgba(245,184,0,0.5); }

  .dash {
    color: var(--muted);
    font-size: 1rem;
    font-weight: 700;
  }

  .result-badge {
    width: 28px;
    height: 20px;
    border-radius: 4px;
    font-size: 0.65rem;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .badge-H { background: rgba(76,175,80,0.2); color: var(--green); border: 1px solid rgba(76,175,80,0.3); }
  .badge-D { background: rgba(255,152,0,0.2); color: var(--draw); border: 1px solid rgba(255,152,0,0.3); }
  .badge-A { background: rgba(233,69,96,0.2); color: var(--loss); border: 1px solid rgba(233,69,96,0.3); }

  /* FINAL */
  .final-section {
    background: var(--card);
    border: 1px solid var(--gold);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }

  .final-section h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    color: var(--gold);
    letter-spacing: 2px;
    margin-bottom: 20px;
    text-align: center;
  }

  .final-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .final-match {
    background: var(--mid);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
  }

  .final-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .final-winner-input {
    width: 100%;
    background: var(--dark);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--gold);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1px;
    outline: none;
    transition: border-color 0.2s;
  }
  .final-winner-input:focus { border-color: var(--gold); }
  .final-winner-input::placeholder { color: var(--muted); font-weight: 400; }

  /* SCOREBOARD */
  #scoreboard {
    display: none;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px;
  }

  .scoreboard-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.5rem;
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 20px;
    text-align: center;
  }

  .ranking-table {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    width: 100%;
  }

  .ranking-table th {
    background: var(--border);
    padding: 12px 16px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    text-align: left;
  }

  .ranking-table td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
  }

  .rank-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    color: var(--muted);
    width: 40px;
  }
  .rank-1 { color: var(--gold); }
  .rank-2 { color: #C0C0C0; }
  .rank-3 { color: #CD7F32; }

  .rank-name {
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 1.1rem;
  }

  .rank-pts {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    color: var(--gold);
    text-align: right;
  }

  .rank-detail {
    font-size: 0.8rem;
    color: var(--muted);
  }

  /* TABS */
  .tab-bar {
    display: flex;
    gap: 0;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
    justify-content: center;
  }

  .tab {
    padding: 12px 24px;
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: all 0.2s;
  }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }
  .tab:hover:not(.active) { color: var(--text); }

  .progress-info {
    text-align: center;
    color: var(--muted);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.9rem;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .progress-bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    border-radius: 2px;
    transition: width 0.3s;
  }

  @media(max-width:600px){
    .final-grid { grid-template-columns: 1fr; }
    .groups-grid { grid-template-columns: 1fr; }
    .top-bar { justify-content: center; }
  }

  .section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    text-align: center;
    margin: 30px 0 10px;
  }

  .winner-podium {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 30px;
  }

  .podium-item {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    min-width: 140px;
  }
  .podium-medal { font-size: 2rem; display: block; }
  .podium-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    margin: 6px 0 4px;
  }
  .podium-team {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 1px;
    color: var(--gold);
  }
  .podium-pts {
    font-size: 0.85rem;
    color: var(--muted);
    margin-top: 4px;
  }
</style>
</head>
<body>

<header>
  <span class="trophy">🏆</span>
  <h1>MUNDIAL<br>2026</h1>
  <p class="subtitle">Quiniela · USA · México · Canadá</p>
</header>

<!-- SETUP SCREEN -->
<div class="player-setup" id="setup">
  <div class="setup-card">
    <h2>¿Quiénes juegan?</h2>
    <p style="color:var(--muted);font-size:0.9rem;margin-bottom:20px;">Añade los nombres de los participantes</p>
    <div class="input-row">
      <input type="text" class="player-input" id="nameInput" placeholder="Nombre del jugador..." maxlength="20" onkeydown="if(event.key==='Enter')addPlayer()">
      <button class="btn btn-gold" onclick="addPlayer()">+</button>
    </div>
    <div class="players-list" id="playersList"></div>
    <button class="btn btn-accent" onclick="startQuiniela()" id="startBtn" disabled>
      ¡EMPEZAR QUINIELA!
    </button>
  </div>
</div>

<!-- MAIN QUINIELA -->
<div id="quiniela">
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('grupos')">Grupos</button>
    <button class="tab" onclick="showTab('finales')">Finales</button>
    <button class="tab" onclick="showTab('tabla')">Tabla</button>
  </div>

  <!-- GRUPOS TAB -->
  <div id="tab-grupos">
    <div class="top-bar">
      <div class="player-selector" id="playerSelector"></div>
      <div class="score-bar" id="liveScore"></div>
    </div>
    <div class="progress-info" id="progressInfo"></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="groups-grid" id="groupsGrid"></div>
  </div>

  <!-- FINALES TAB -->
  <div id="tab-finales" style="display:none">
    <div class="top-bar">
      <div class="player-selector" id="playerSelector2"></div>
    </div>
    <div class="final-section">
      <h2>🏆 FASE ELIMINATORIA</h2>
      <div class="final-grid" id="finalesGrid"></div>
    </div>
  </div>

  <!-- TABLA TAB -->
  <div id="tab-tabla" style="display:none">
    <div id="scoreboardContent"></div>
  </div>
</div>

<script>
const GROUPS = {
  A: { teams: ['🇲🇽 México','🇿🇦 Sudáfrica','🇰🇷 Corea del Sur','🇨🇿 Rep. Checa'] },
  B: { teams: ['🇨🇦 Canadá','🇶🇦 Qatar','🇨🇭 Suiza','🇧🇦 Bosnia'] },
  C: { teams: ['🇧🇷 Brasil','🇲🇦 Marruecos','🏴󠁧󠁢󠁳󠁣󠁴󠁿 Escocia','🇭🇹 Haití'] },
  D: { teams: ['🇺🇸 Estados Unidos','🇵🇾 Paraguay','🇦🇺 Australia','🇹🇷 Turquía'] },
  E: { teams: ['🇩🇪 Alemania','🇪🇨 Ecuador','🇨🇼 Curazao','🇨🇮 Costa de Marfil'] },
  F: { teams: ['🇳🇱 Países Bajos','🇯🇵 Japón','🇹🇳 Túnez','🇸🇪 Suecia'] },
  G: { teams: ['🇧🇪 Bélgica','🇮🇷 Irán','🇪🇬 Egipto','🇳🇿 Nueva Zelanda'] },
  H: { teams: ['🇪🇸 España','🇺🇾 Uruguay','🇦🇷 Arabia Saudita','🇨🇻 Cabo Verde'] },
  I: { teams: ['🇫🇷 Francia','🇸🇳 Senegal','🇳🇴 Noruega','🇮🇶 Irak'] },
  J: { teams: ['🇦🇷 Argentina','🇩🇿 Argelia','🇦🇹 Austria','🇯🇴 Jordania'] },
  K: { teams: ['🇵🇹 Portugal','🇨🇴 Colombia','🇺🇿 Uzbekistán','🇨🇩 R.D. Congo'] },
  L: { teams: ['🇬🇧 Inglaterra','🇭🇷 Croacia','🇵🇦 Panamá','🇬🇭 Ghana'] }
};

const FINAL_ROUNDS = [
  { id:'semi1', label:'SEMIFINAL 1' },
  { id:'semi2', label:'SEMIFINAL 2' },
  { id:'tercero', label:'TERCER LUGAR' },
  { id:'campeon', label:'🏆 CAMPEÓN DEL MUNDO' }
];

let players = [];
let currentPlayer = 0;
let predictions = {}; // predictions[playerIdx][matchId] = {home, away}
let finalPreds = {}; // finalPreds[playerIdx][roundId] = winner

function addPlayer() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name || players.includes(name) || players.length >= 8) return;
  players.push(name);
  input.value = '';
  renderPlayersList();
  document.getElementById('startBtn').disabled = players.length < 2;
}

function removePlayer(idx) {
  players.splice(idx, 1);
  renderPlayersList();
  document.getElementById('startBtn').disabled = players.length < 2;
}

function renderPlayersList() {
  const el = document.getElementById('playersList');
  el.innerHTML = players.map((p, i) =>
    `<div class="player-tag" onclick="removePlayer(${i})">${p} <span style="opacity:0.5">✕</span></div>`
  ).join('');
}

function startQuiniela() {
  // init predictions
  players.forEach((_, i) => {
    predictions[i] = {};
    finalPreds[i] = {};
  });
  document.getElementById('setup').style.display = 'none';
  document.getElementById('quiniela').style.display = 'block';
  buildPlayerSelectors();
  buildGroups();
  buildFinales();
  selectPlayer(0);
}

function buildPlayerSelectors() {
  ['playerSelector','playerSelector2'].forEach(id => {
    document.getElementById(id).innerHTML = players.map((p, i) =>
      `<button class="player-btn${i===0?' active':''}" onclick="selectPlayer(${i})" id="${id}-${i}">${p}</button>`
    ).join('');
  });
}

function selectPlayer(idx) {
  currentPlayer = idx;
  document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll(`[id$="-${idx}"]`).forEach(b => b.classList.add('active'));
  refreshGroups();
  refreshFinales();
  updateProgress();
}

function getMatchId(group, i, j) { return `${group}_${i}_${j}`; }

function buildGroups() {
  const grid = document.getElementById('groupsGrid');
  grid.innerHTML = '';
  Object.entries(GROUPS).forEach(([letter, {teams}]) => {
    const card = document.createElement('div');
    card.className = 'group-card';
    const matches = [];
    for(let i=0;i<teams.length;i++)
      for(let j=i+1;j<teams.length;j++)
        matches.push([i,j]);

    card.innerHTML = `
      <div class="group-header">
        <div class="group-letter">${letter}</div>
        <div class="group-teams-names">${teams.map(t=>t.split(' ').slice(1).join(' ')).join(' · ')}</div>
      </div>
      <div class="matches-list" id="matches-${letter}">
        ${matches.map(([i,j]) => buildMatchRow(letter, teams, i, j)).join('')}
      </div>
    `;
    grid.appendChild(card);
  });
}

function buildMatchRow(letter, teams, i, j) {
  const mid = getMatchId(letter, i, j);
  const t1 = teams[i].split(' ')[0];
  const n1 = teams[i].split(' ').slice(1).join(' ');
  const t2 = teams[j].split(' ')[0];
  const n2 = teams[j].split(' ').slice(1).join(' ');
  return `
    <div class="match-row" id="row-${mid}">
      <div class="team-name team-home">${n1}</div>
      <div class="team-flag">${t1}</div>
      <div class="score-inputs">
        <input type="number" class="score-input" id="h-${mid}" min="0" max="20" placeholder="-"
          onchange="savePred('${mid}',true)" oninput="savePred('${mid}',true)">
        <span class="dash">—</span>
        <input type="number" class="score-input" id="a-${mid}" min="0" max="20" placeholder="-"
          onchange="savePred('${mid}',false)" oninput="savePred('${mid}',false)">
      </div>
      <div class="team-flag">${t2}</div>
      <div class="team-name team-away">${n2}</div>
      <div class="result-badge" id="badge-${mid}"></div>
    </div>
  `;
}

function savePred(mid, isHome) {
  const h = document.getElementById(`h-${mid}`).value;
  const a = document.getElementById(`a-${mid}`).value;
  if (h !== '' && a !== '') {
    if (!predictions[currentPlayer]) predictions[currentPlayer] = {};
    predictions[currentPlayer][mid] = { home: parseInt(h), away: parseInt(a) };
  }
  updateBadge(mid);
  updateProgress();
}

function updateBadge(mid) {
  const badge = document.getElementById(`badge-${mid}`);
  if (!badge) return;
  const h = document.getElementById(`h-${mid}`)?.value;
  const a = document.getElementById(`a-${mid}`)?.value;
  if (h === '' || a === '') { badge.className='result-badge'; badge.textContent=''; return; }
  const hi = parseInt(h), ai = parseInt(a);
  if (hi > ai) { badge.className='result-badge badge-H'; badge.textContent='L1'; }
  else if (hi < ai) { badge.className='result-badge badge-A'; badge.textContent='L2'; }
  else { badge.className='result-badge badge-D'; badge.textContent='X'; }
}

function refreshGroups() {
  const preds = predictions[currentPlayer] || {};
  Object.entries(GROUPS).forEach(([letter, {teams}]) => {
    for(let i=0;i<teams.length;i++) {
      for(let j=i+1;j<teams.length;j++) {
        const mid = getMatchId(letter, i, j);
        const pred = preds[mid];
        const hEl = document.getElementById(`h-${mid}`);
        const aEl = document.getElementById(`a-${mid}`);
        if (!hEl) continue;
        if (pred) {
          hEl.value = pred.home;
          aEl.value = pred.away;
          hEl.classList.add('filled');
          aEl.classList.add('filled');
        } else {
          hEl.value = '';
          aEl.value = '';
          hEl.classList.remove('filled');
          aEl.classList.remove('filled');
        }
        updateBadge(mid);
      }
    }
  });
}

function buildFinales() {
  const grid = document.getElementById('finalesGrid');
  grid.innerHTML = FINAL_ROUNDS.map(({id, label}) => `
    <div class="final-match">
      <div class="final-label">${label}</div>
      <input type="text" class="final-winner-input" id="final-${id}"
        placeholder="Escribe el equipo..."
        onchange="saveFinal('${id}')" oninput="saveFinal('${id}')">
    </div>
  `).join('');
}

function saveFinal(id) {
  if (!finalPreds[currentPlayer]) finalPreds[currentPlayer] = {};
  finalPreds[currentPlayer][id] = document.getElementById(`final-${id}`).value;
}

function refreshFinales() {
  const fp = finalPreds[currentPlayer] || {};
  FINAL_ROUNDS.forEach(({id}) => {
    const el = document.getElementById(`final-${id}`);
    if (el) el.value = fp[id] || '';
  });
}

function updateProgress() {
  const total = Object.values(GROUPS).reduce((s,g)=>{
    const n = g.teams.length;
    return s + n*(n-1)/2;
  }, 0);
  const done = Object.keys(predictions[currentPlayer]||{}).length;
  const pct = Math.round(done/total*100);
  document.getElementById('progressInfo').textContent = `${players[currentPlayer]}: ${done}/${total} partidos completados`;
  document.getElementById('progressFill').style.width = pct+'%';
  document.getElementById('liveScore').textContent = `${pct}% completado`;
}

function showTab(tab) {
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.remove('active'));
  ['grupos','finales','tabla'].forEach(t => {
    document.getElementById(`tab-${t}`).style.display = t===tab?'block':'none';
  });
  event.target.classList.add('active');
  if(tab==='tabla') buildScoreboard();
}

// SCORING: exact = 3pts, result = 1pt
function calcScore(playerIdx) {
  const preds = predictions[playerIdx] || {};
  let pts = 0, exact = 0, result = 0;
  // vs other players' predictions (average)
  players.forEach((_, otherIdx) => {
    if (otherIdx === playerIdx) return;
    const other = predictions[otherIdx] || {};
    Object.keys(preds).forEach(mid => {
      const p = preds[mid];
      const o = other[mid];
      if (!o) return;
      if (p.home === o.home && p.away === o.away) { pts += 3; exact++; }
      else {
        const pr = Math.sign(p.home - p.away);
        const or = Math.sign(o.home - o.away);
        if (pr === or) { pts += 1; result++; }
      }
    });
  });
  return { pts, exact, result, filled: Object.keys(preds).length };
}

function buildScoreboard() {
  const scores = players.map((name, i) => {
    const s = calcScore(i);
    const fp = finalPreds[i] || {};
    return { name, ...s, campeon: fp.campeon || '—' };
  }).sort((a,b) => b.pts - a.pts || b.exact - a.exact || b.filled - a.filled);

  const medals = ['🥇','🥈','🥉'];

  let html = `<div class="scoreboard-title">📊 TABLA DE POSICIONES</div>`;

  if (players.length >= 2) {
    html += `<div class="winner-podium">`;
    scores.slice(0,3).forEach((s, i) => {
      html += `
        <div class="podium-item">
          <span class="podium-medal">${medals[i]||'🏅'}</span>
          <div class="podium-label">${['Campeón','2° Lugar','3° Lugar'][i]||'Top'}</div>
          <div class="podium-team">${s.name}</div>
          <div class="podium-pts">${s.pts} pts</div>
        </div>`;
    });
    html += `</div>`;
  }

  html += `<table class="ranking-table" style="border-collapse:collapse">
    <thead><tr>
      <th style="width:50px">#</th>
      <th>Jugador</th>
      <th>Predicciones</th>
      <th>Campeón</th>
      <th style="text-align:right">PTS</th>
    </tr></thead><tbody>`;

  scores.forEach((s, i) => {
    html += `<tr>
      <td class="rank-num rank-${i+1}">${i+1}</td>
      <td class="rank-name">${s.name}</td>
      <td class="rank-detail">${s.filled} partidos · ${s.exact} exactos · ${s.result} acertados</td>
      <td style="font-family:'Barlow Condensed';color:var(--muted)">${s.campeon}</td>
      <td class="rank-pts">${s.pts}</td>
    </tr>`;
  });

  html += `</tbody></table>
    <p style="text-align:center;color:var(--muted);font-size:0.8rem;margin-top:16px;font-family:'Barlow Condensed';letter-spacing:1px">
      PUNTUACIÓN: Resultado exacto = 3 pts · Resultado correcto = 1 pt · (comparando predicciones entre jugadores)
    </p>`;

  document.getElementById('scoreboardContent').innerHTML = html;
}
</script>
</body>
</html>
